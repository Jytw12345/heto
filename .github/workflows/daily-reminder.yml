name: Daily Contract Reminder (manual)

# 定时触发已迁到 cron-job.org（避免 GitHub 免费仓库 60 天无提交活动自动禁用 schedule）。
# 本 workflow 仅保留 workflow_dispatch 手动触发，方便随时在 Actions 页面点一下测试。
on:
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call daily-reminder
        run: |
          code=$(curl -sS -o resp.json -w '%{http_code}' -X POST \
            "$REMINDER_ENDPOINT" \
            -H "Authorization: Bearer $CRON_SECRET")
          echo "HTTP $code"
          echo "--- response ---"
          cat resp.json
          echo
          if [ "$code" != "200" ]; then
            echo "::error::daily-reminder 返回非 200"
            exit 1
          fi
        env:
          REMINDER_ENDPOINT: ${{ secrets.REMINDER_ENDPOINT }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
