name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 前端构建期注入的 VITE_ 变量（均为公开、非机密：anon key 本就暴露在前端 bundle）
      # 以下值需在仓库 Settings → Secrets and variables → Actions 中添加同名 Repository secrets
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_COS_BUCKET: ${{ secrets.VITE_COS_BUCKET }}
      VITE_COS_REGION: ${{ secrets.VITE_COS_REGION }}
      VITE_COS_PREFIX: ${{ secrets.VITE_COS_PREFIX }}
      # GitHub Pages 项目站点根路径 = /<仓库名>/，自动推导，无需手动填
      GH_PAGES_BASE: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 使用 npm install 而非 npm ci：兼容 package-lock.json 与 package.json 不同步的情况
      # CI 环境首次安装会自动生成/补全 lock；同时确保传递依赖（如 react-is）能被解析
      - run: npm install --no-audit --no-fund --legacy-peer-deps

      - run: npm run build

      # SPA 路由回退：GitHub Pages 默认不识别前端路由，刷新子页面会 404；
      # 复制 index.html 为 404.html，让浏览器加载后由前端 router 接管。
      - name: SPA fallback (404.html)
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
